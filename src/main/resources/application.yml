spring:
  application:
    name: BarbeariaApi
  datasource:
    url:  jdbc:postgresql://localhost:5432/barbearia
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
  JWT:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}